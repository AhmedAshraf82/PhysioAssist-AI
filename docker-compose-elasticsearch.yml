

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.keystore.path=certs/elasticsearch/elastic-cert.p12
      - xpack.security.http.ssl.keystore.password=""
      - ELASTIC_PASSWORD=elastic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    networks:
      - elastic
    volumes:
      - ./certs/elasticsearch:/usr/share/elasticsearch/config/certs/elasticsearch

networks:
  elastic:
    name: elastic
    driver: bridge
